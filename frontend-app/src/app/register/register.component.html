<div class="container register-container">
  <div class="form-box">
    <form (ngSubmit)="register()" #regForm="ngForm" novalidate>
      <h2 class="form-title">Register</h2>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

      <input
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Full Name"
        required
        autocomplete="name"
        class="form-input"
      />

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        required
        autocomplete="email"
        class="form-input"
      />

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required
        autocomplete="new-password"
        class="form-input"
      />

      <button
        type="submit"
        [disabled]="regForm.invalid"
        class="btn-submit"
      >
        Register
      </button>

      <p class="form-footer">
        Already have an account?
        <a routerLink="/login" class="link">Login here</a>
      </p>
    </form>
  </div>
</div>
