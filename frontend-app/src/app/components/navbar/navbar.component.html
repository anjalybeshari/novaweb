<nav class="navbar">
  <div class="nav-main">
    <div class="logo">Nova</div>
    <div class="nav-left">

      <a routerLink="/">Home</a>

      <!-- Collection navigon në display-all -->
      <a routerLink="/display-all" class="collections-link">
        Collection
      </a>

      <!-- Categories si link ndarës me dropdown -->
      <div class="categories-container" style="position: relative; display: inline-block;">
        <a href="#" (click)="toggleCategories(); $event.preventDefault()" class="categories-link">
          Categories
        </a>

        <div *ngIf="showCategories" class="categories-dropdown">
          <ul>
            <li *ngFor="let cat of categories" (click)="filterByCategory(cat.id)">
              {{ cat.name }}
            </li>
          </ul>
        </div>
      </div>

      <!-- Search toggle dhe form -->
      <span *ngIf="!showSearch" class="nav-link search-toggle" (click)="toggleSearch()" class="word">Search</span>

      <form *ngIf="showSearch" (ngSubmit)="submit()" class="search-bar">
        <span class="material-icons search-icon">search</span>
        <input
          id="navbar-search-input"
          [(ngModel)]="query"
          name="q"
          type="text"
          placeholder="Search..."
        />
      </form>

    </div>
  </div>

  <div class="nav-right">
    <a routerLink="/cart">
      <span class="material-icons">shopping_cart</span>
    </a>
    <a routerLink="/login">Log In</a>
    <a routerLink="/register">Register</a>
  </div>
</nav>
